<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcements | Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="index.html">NEWS LETTER</a>
      <nav><a href="index.html">Home</a></nav>
    </header>

    <section class="auth-card">
      <div class="tabs">
        <button class="tab active" type="button" data-panel="loginPanel">Log in</button>
        <button class="tab" type="button" data-panel="signupPanel">Sign up</button>
      </div>

      <section id="loginPanel">
        <h1>Welcome back</h1>
        <p class="muted">Log in to view announcements.</p>

        <form id="loginForm">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" required>

          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required>

          <button class="button full" type="submit">Log in</button>
        </form>
      </section>

      <section id="signupPanel" hidden>
        <h1>Create a client account</h1>
        <p class="muted">New accounts have client access.</p>

        <form id="signupForm">
          <label for="signupName">Name</label>
          <input id="signupName" required>

          <label for="signupEmail">Email</label>
          <input id="signupEmail" type="email" required>

          <label for="signupPassword">Password</label>
          <input id="signupPassword" type="password" minlength="6" required>

          <button class="button full" type="submit">Sign up</button>
        </form>
      </section>

      <p id="authMessage" class="message" hidden></p>
      <p class="demo">Demo admin: <b>admin@example.com</b> / <b>Admin123!</b></p>
    </section>
  </main>
</body>
</html>
